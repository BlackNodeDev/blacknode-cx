  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><circle cx="17" cy="9.5" r="2.3"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8M15 14.6c2.6-.4 4.8 1.2 5.5 4.4"/></symbol>
  <symbol id="i-dollar" viewBox="0 0 24 24"><path d="M12 3.5v17M16 7.5c-.6-1.3-2-2-4-2-2.3 0-3.8 1.1-3.8 2.9 0 4.2 8 2.2 8 6.6 0 1.9-1.7 3-4.2 3-2.1 0-3.6-.8-4.2-2.3"/></symbol>

  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="10" rx="2"/><path d="M3 19h18l-1.5-4h-15L3 19Z"/></symbol>

<div id="app" class="shell" data-route="chat">
 <!-- Desktop dock rail (md+) -->
 <aside class="dock" data-dock aria-label="Main navigation (desktop)">
  <div class="dock-avatar-slot" aria-hidden="true"></div>
  <nav class="dock-nav" id="dockNav"></nav>
  <div class="dock-bottom">
   <button class="dock-btn" data-go="settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
   <button class="dock-btn" data-act="open-search" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
   <button class="dock-btn" data-act="new-side" aria-label="New side chat"><svg class="ic"><use href="#i-compose"/></svg></button>
  </div>
 </aside>

 <main class="frame" id="frame">
  <!-- CHAT ROUTE -->
  <section class="route route-chat" data-view="chat" aria-label="Chat">
   <div class="chat-toolbar">
    <div class="chat-nav-fade" aria-hidden="true"></div>
    <div class="chat-leading">
     <button class="blur-btn" id="chatSwitcher" aria-haspopup="dialog" aria-label="Open chat and side chats"><svg class="ic sm"><use href="#i-more"/></svg></button>
     <button class="thread-title" id="threadTitle" data-act="open-sides"><b id="threadName">Main chat</b><small id="threadSub">BlackNode</small></button>
    </div>
    <div class="chat-trailing">
     <button class="blur-btn" id="callBtn" aria-label="Voice call"><svg class="ic"><use href="#i-phone"/></svg></button>
     <button class="blur-btn" data-act="new-side" aria-label="New side chat"><svg class="ic"><use href="#i-compose"/></svg></button>
    </div>
   </div>

   <div class="chat-scroll" id="chatScroll">
    <div class="chat-feed">
     <div class="chat-column" id="chatColumn" role="log" aria-live="polite" aria-label="Chat messages"></div>
    </div>
   </div>
   <button class="jump-down" id="jumpDown" aria-label="Scroll to latest" hidden><svg class="ic sm"><use href="#i-down"/></svg></button>

   <!-- Composer -->
   <div class="composer-layer">
    <div class="chat-col-w">
     <div class="attach-row" id="attachRow" hidden></div>
     <form class="composer" id="composer" autocomplete="off">
      <input type="file" id="fileIn" multiple hidden accept=".txt,.md,.json,.csv,.js,.ts,.html,.css,.py,.xml,.yml,.yaml,text/*">
      <button type="button" class="cbtn cbtn-start" id="attachBtn" aria-label="Attach file"><svg class="ic"><use href="#i-plus"/></svg></button>
      <textarea id="inp" rows="1" aria-label="Message" placeholder="Message"></textarea>
      <div class="cbtn-end">
       <button type="button" class="cbtn" id="micBtn" aria-label="Dictate a message"><svg class="ic"><use href="#i-mic"/></svg></button>
       <button type="submit" class="cbtn send" id="sendBtn" aria-label="Send" hidden><svg class="ic"><use href="#i-send"/></svg></button>
      </div>
     </form>
    </div>
   </div>
  </section>

  <!-- PAGE ROUTES -->
  <section class="route route-page" data-view="feed" aria-label="Feed"><div class="page" id="pFeed"></div></section>
  <section class="route route-page" data-view="ideas" aria-label="Ideas"><div class="page" id="pIdeas"></div></section>
  <section class="route route-page" data-view="goals" aria-label="Goals"><div class="page" id="pGoals"></div></section>
  <section class="route route-page" data-view="library" aria-label="Library"><div class="page" id="pLibrary"></div></section>
  <section class="route route-page" data-view="spaces" aria-label="Spaces"><div class="page" id="pSpaces"></div></section>
  <section class="route route-page" data-view="settings" aria-label="Settings"><div class="page" id="pSettings"></div></section>

  <!-- Mobile tab bar -->
  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
 </main>

 <!-- AVATAR HOST: live 3D model canvas (added by js/avatar3d.js) over a still-pose poster + status pill -->
 <div class="av-host" id="avHost" data-avatar-host data-state="idle" data-display-stage="chat-nav">
  <div class="av-stage">
   <div class="av-btn" id="avBtn" role="button" tabindex="0" aria-label="BlackNode status: what I'm working on">
    <span class="av-ring" aria-hidden="true"></span>
    <div class="av-clip">
     <img class="av-poster" id="avPoster" alt="" aria-hidden="true" data-motion="bob" src="avatar/poses/idle.png">
    </div>
    <span class="av-inset" aria-hidden="true"></span>
    <span class="av-acc" id="avAcc" aria-hidden="true"></span>
   </div>
   <div class="av-pill" id="avPill" role="button" tabindex="0" aria-label="BlackNode status">
    <span class="av-name" id="avName">BlackNode</span>
    <span class="av-task" id="avTask"></span>
   </div>
   <span class="sr-only" id="avAnnounce" role="status" aria-live="polite" aria-atomic="true"></span>
  </div>
 </div>

 <!-- Side chats panel -->
 <div class="scrim" id="sideScrim" hidden></div>
 <aside class="sides" id="sides" aria-label="Chats" aria-hidden="true">
  <div class="sides-head">
   <label class="search-pill"><svg class="ic sm"><use href="#i-search"/></svg><input id="sideSearch" placeholder="Search" aria-label="Search chats"></label>
   <button class="icon-btn" data-act="sides-menu" aria-label="Chat options"><svg class="ic sm"><use href="#i-dots"/></svg></button>
  </div>
  <div id="sidesBody"></div>
 </aside>

 <!-- Bottom sheet (drawer + generic sheets) -->
 <div class="scrim" id="sheetScrim" hidden></div>
 <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
 </div>

 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
