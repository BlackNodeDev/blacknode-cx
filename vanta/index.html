<style>
:root{--bg:#07090d;--panel:#0b0e14;--panel2:#0d1119;--surface:#0d1119;--surface2:#111624;--line:#232b3d;--line2:#2e3850;--text:#e8ecf4;--mut:#8b94a9;--dim:#5b6378;--mg:#e041ff;--mg2:#f07bff;--glow:#e041ff;--violet:#a855f7;--blue:#3c82f6;--green:#3dffa2;--orange:#ffb347;--cyan:#54b9a6;--red:#ff5470;--r:14px;--safeb:env(safe-area-inset-bottom,0px);
 --display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 0%,#000 35%,transparent 90%);mask-image:radial-gradient(ellipse 100% 80% at 50% 0%,#000 35%,transparent 90%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--mg2)}
::selection{background:var(--mg);color:#fff}
:focus-visible{outline:2px solid var(--mg);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em}
.app{display:flex;height:100%;height:100dvh;position:relative;z-index:1}
#side{width:272px;flex:none;background:rgba(7,9,13,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px calc(12px + var(--safeb));z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 0 18px -4px rgba(224,65,255,.6)}
.wm{font:600 12px/1.2 var(--mono);letter-spacing:.14em;color:#fff;text-transform:uppercase}.wm b{color:var(--mg);font-weight:700;text-shadow:0 0 14px rgba(224,65,255,.55)}
.wm small{display:block;font:500 10px/1.4 var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:none}
.newchat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;padding:10px;border-radius:12px;background:var(--mg);color:#07090d;font:700 14px/1 var(--display);letter-spacing:.02em;box-shadow:0 0 22px -6px var(--mg)}
.newchat svg{stroke:#07090d!important}
.nav{margin:14px 0 6px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;min-height:42px;padding:9px 12px;border-radius:10px;color:var(--mut);text-align:left;font-weight:500}
.nav button:hover,.nav button.on{background:var(--surface2);color:#fff}
.nav svg,.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sect{font:600 10.5px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.12em;padding:14px 12px 8px}
#recent{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px;min-height:60px}
#recent button{display:flex;justify-content:space-between;gap:8px;min-height:38px;padding:8px 12px;border-radius:10px;color:var(--mut);text-align:left;font-size:14px}
#recent button span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#recent button small{color:var(--dim);flex:none;font:500 11px/1.6 var(--mono)}
#recent button:hover,#recent button.on{background:var(--surface2);color:#fff}
#recent button.on{box-shadow:inset 2px 0 0 var(--mg)}
.bnlinks{display:flex;gap:6px;margin-top:8px}
.bnlinks a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid var(--line);border-radius:10px;font:600 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--mut);text-decoration:none;text-transform:uppercase}
.bnlinks a:hover{border-color:var(--mg);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);margin-top:8px;border-radius:12px;width:100%;text-align:left}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--mg);font:700 14px/1 var(--display);flex:none}
.me b{font-weight:600;font-size:14px}.me small{display:block;color:var(--dim);font:500 10.5px/1.4 var(--mono);letter-spacing:.06em}
.scrim{display:none}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));height:58px;flex:none;border-bottom:1px solid var(--line);background:rgba(7,9,13,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--mut);position:relative}
.ib:hover{background:var(--surface2);color:#fff}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--mg);box-shadow:0 0 10px var(--mg)}
.pill.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.grow{flex:1}
.mob{display:none}
#view{flex:1;overflow:auto;overflow-x:hidden;padding:0 16px}
.inner{max-width:820px;margin:0 auto;padding-bottom:20px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6vh 0 10px;position:relative}
.hero::before{content:"";position:absolute;top:2vh;left:50%;width:min(520px,90vw);height:260px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(224,65,255,.22),transparent);pointer-events:none;z-index:-1}
.hero .logo{width:84px;height:84px;border-radius:24px;filter:drop-shadow(0 0 26px rgba(224,65,255,.45))}
.vchip{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:6px 10px;border:1px solid var(--line2);background:rgba(13,17,25,.8);font:500 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.vchip .nw{background:var(--mg);color:#07090d;padding:3px 6px;font-weight:700}.vchip strong{color:#fff}
.hero h1{margin:16px 0 6px;font-size:clamp(28px,6vw,44px);line-height:1.08;font-weight:700}
.hero h1 b{color:var(--mg);text-shadow:0 0 28px rgba(224,65,255,.55)}
.hero p{margin:4px 0;color:var(--mut)}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 6px;width:100%}
.card{text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:rgba(13,17,25,.85);transition:.15s;position:relative}
.card:hover{border-color:var(--mg);box-shadow:0 0 24px -6px rgba(224,65,255,.4)}
.card .ci,.li .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(224,65,255,.12);color:var(--mg);margin-bottom:10px;flex:none}
.card[data-card=create] .ci{background:rgba(136,92,245,.14);color:var(--violet)}
.card[data-card=analyze] .ci{background:rgba(60,130,246,.14);color:var(--blue)}
.card[data-card=plan] .ci{background:rgba(91,198,122,.14);color:var(--green)}
.li .ci{margin:0}
.card .ci svg,.li .ci svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.card b{display:block;font:600 15px/1.3 var(--display)}.card span{color:var(--mut);font-size:13px}
.imgbtn{margin-top:22px;width:60px;height:60px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;box-shadow:0 0 26px -8px rgba(224,65,255,.6);color:var(--mg)}
.imgbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.imglbl{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.msg{display:flex;gap:10px;margin:18px 0}
.msg.user{justify-content:flex-end}
.msg .bub{max-width:min(680px,86%);padding:11px 15px;border-radius:16px;overflow-wrap:anywhere}
.msg.user .bub{background:var(--surface2);border:1px solid var(--line2);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.ai .bub{background:transparent;padding:2px 0;max-width:100%;flex:1;min-width:0}
.msg.ai .mav{width:30px;height:30px;border-radius:9px;flex:none;margin-top:2px}
.aname{font:600 10.5px/1 var(--mono);letter-spacing:.12em;color:var(--mut);margin:7px 0 6px;text-transform:uppercase}.aname b{color:var(--mg)}
.bub p{margin:.4em 0}.bub ul,.bub ol{margin:.3em 0;padding-left:1.3em}
.bub h1,.bub h2,.bub h3{font-size:1.1em;margin:.8em 0 .3em}
.bub code{background:var(--surface2);border:1px solid var(--line2);padding:1px 5px;border-radius:6px;font:12.5px var(--mono)}
.code{margin:10px 0;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#05070a;position:relative}
.code .bar{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;background:var(--surface);border-bottom:1px solid var(--line);color:var(--mut);font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.code .bar button{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);color:var(--text);font:600 11px/1 var(--mono);letter-spacing:.04em;text-transform:none}
.code .bar button.run{background:var(--mg);border-color:var(--mg);color:#07090d;box-shadow:0 0 14px -4px var(--mg)}
.code pre{margin:0;padding:12px;overflow:auto;font:12.5px/1.55 var(--mono);max-height:420px}
.code pre code{background:none;border:0;padding:0}
details.think{margin:0 0 10px;color:var(--mut);font-size:13px;border:1px solid var(--line);border-left:2px solid var(--violet);border-radius:0 10px 10px 0;padding:8px 12px;background:rgba(136,92,245,.05)}
details.think summary{cursor:pointer;color:var(--violet);font:600 10.5px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;list-style:none}
details.think summary::-webkit-details-marker{display:none}
details.think summary::before{content:"\25B8  "}details.think[open] summary::before{content:"\25BE  "}
details.think div{white-space:pre-wrap;max-height:240px;overflow:auto;margin-top:6px;font-size:13px;line-height:1.5}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.acts button{min-height:32px;padding:0 10px;border-radius:8px;color:var(--dim);font:600 11px/1 var(--mono);letter-spacing:.04em}
.acts button:hover{background:var(--surface2);color:#fff}
.err{border:1px solid #5a1d38;background:#1a0a14;color:#ffb3c8;padding:10px 12px;border-radius:12px;margin-top:6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.err button{margin-left:auto;min-height:36px;padding:0 16px;border-radius:9px;background:var(--mg);color:#07090d;font-weight:700}
.genimg{width:min(420px,100%);aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line2);display:block;margin:6px 0;background:#0d0d14 linear-gradient(110deg,#0d0d14 30%,#2a1030 50%,#0d0d14 70%) 0 0/300% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-300% 0}}
.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mg);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.attach{display:flex;flex-wrap:wrap;gap:6px}
.attach:not(:empty){margin:0 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--mut)}
.chip.on{border-color:var(--mg);background:rgba(224,65,255,.12);color:#fff;box-shadow:0 0 12px -2px rgba(224,65,255,.4)}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
#dock{flex:none;padding:8px 16px calc(10px + var(--safeb));position:relative}
.comp{max-width:820px;margin:0 auto;position:relative;border:1px solid var(--line2);background:rgba(8,11,17,.96);border-radius:4px;padding:8px 8px 8px 10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.comp::before,.comp::after{content:"";position:absolute;width:9px;height:9px;border:solid var(--mg);pointer-events:none}
.comp::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.comp::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.comp:focus-within{border-color:rgba(224,65,255,.55);box-shadow:0 0 28px -8px rgba(224,65,255,.45)}
.crow{display:flex;align-items:flex-end;gap:4px}
#inp{flex:1;resize:none;border:0;outline:0;background:none;padding:10px 6px;max-height:180px;min-height:44px;line-height:1.45;font-size:15.5px}
#inp::placeholder{color:var(--dim)}
.send{width:44px;height:44px;border-radius:50%;background:var(--mg);display:grid;place-items:center;box-shadow:0 0 18px -2px rgba(224,65,255,.7);flex:none;color:#07090d}
.send svg{width:20px;height:20px;stroke:#07090d;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.send.live{background:#fff}.send.live svg{stroke:#000}
.chips{display:flex;gap:6px;padding:4px 2px 2px;align-items:center}
.foot{text-align:center;color:var(--dim);font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;margin-top:8px}
#fab{display:none}
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.open{display:flex}
.sbox{width:min(640px,94vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.7),0 0 40px -10px rgba(224,65,255,.25)}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead h2{margin:0;font-size:20px;flex:1;font-weight:600}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font:600 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);outline:0}
.in:focus{border-color:var(--mg);box-shadow:0 0 0 3px rgba(224,65,255,.15)}
textarea.in{min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--mg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--mg)}
.btn.pri{background:var(--mg);border-color:var(--mg);color:#07090d;font-weight:700;box-shadow:0 0 16px -4px rgba(224,65,255,.6)}
.btn.dan{border-color:#5a1d38;color:#ff9db8}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}

function md(src){
 const blocks=[];let s=String(src||'');
 s=s.replace(/```([\w+-]*)[^\n]*\n([\s\S]*?)(```|$)/g,(m,lang,code)=>{blocks.push({lang:lang||'',code});return `\n\u0000${blocks.length-1}\u0000\n`;});
 s=esc(s);
 const lines=s.split('\n');let out='',list=null,table=[];
 const close=()=>{if(list){out+=`</${list}>`;list=null;}};
 const flushT=()=>{if(!table.length)return;const rows=table.filter(r=>!/^\|[\s:|-]+\|$/.test(r.trim()));out+='<div style="overflow:auto"><table style="border-collapse:collapse;font-size:13px;margin:8px 0">'+rows.map((r,ri)=>'<tr>'+r.trim().replace(/^\||\|$/g,'').split('|').map(c=>`<${ri?'td':'th'} style="border:1px solid #30303f;padding:6px 9px;text-align:left">${inlineMd(c.trim())}</${ri?'td':'th'}>`).join('')+'</tr>').join('')+'</table></div>';table=[];};
 for(const ln of lines){
  let m;
  if(/^\|.*\|\s*$/.test(ln.trim())){close();table.push(ln);continue;}else flushT();
  if(/^\u0000\d+\u0000$/.test(ln.trim())){close();out+=ln.trim();continue;}
  if((m=ln.match(/^(#{1,4})\s+(.*)/))){close();const h=Math.min(3,m[1].length);out+=`<h${h}>${inlineMd(m[2])}</h${h}>`;continue;}
  if((m=ln.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul';}out+=`<li>${inlineMd(m[1])}</li>`;continue;}
  if((m=ln.match(/^\s*(\d+)[.)]\s+(.*)/))){if(list!=='ol'){close();out+=+m[1]>1?`<ol start="${+m[1]}">`:'<ol>';list='ol';}out+=`<li>${inlineMd(m[2])}</li>`;continue;}
  close(); if(ln.trim())out+=`<p>${inlineMd(ln)}</p>`;
 }
 flushT();close();
 return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>{const b=blocks[i];const isHtml=/^(html|htm)$/i.test(b.lang)||/^\s*(<!doctype html|<html)/i.test(b.code);
  const k=CODE.push(b.code)-1;
  return `<div class="code" data-k="${k}"><div class="bar"><span>${esc(b.lang||'code')}</span><div class="grow"></div>${isHtml?'<button class="run" data-act="preview">▶ Preview</button><button data-act="dl">Save .html</button>':''}<button data-act="copy">Copy</button></div><pre><code>${esc(b.code)}</code></pre></div>`;});
}

/* ---------- On-Device Offline AI (runs inside the browser, lazy-loaded) ---------- */
const TFJS_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
const LOCAL_MODELS={
 smol360:{id:'HuggingFaceTB/SmolLM2-360M-Instruct',name:'SmolLM2 360M Instruct',size:'about 390 MB',mb:390,d:'Balanced. Recommended for phones.'},
 smol135:{id:'HuggingFaceTB/SmolLM2-135M-Instruct',name:'SmolLM2 135M Instruct',size:'about 180 MB',mb:180,d:'Smallest and fastest. Simple answers only.'},
 qwen05:{id:'onnx-community/Qwen2.5-0.5B-Instruct',name:'Qwen2.5 0.5B Instruct',size:'about 790 MB',mb:790,d:'Smartest of the three. Best on desktop.'}
};
const Local={
 lib:null,gen:null,key:null,device:'',state:'idle',pct:0,loaded:0,total:0,err:'',subs:new Set(),loading:null,stopper:null,
 on(fn){this.subs.add(fn);return()=>this.subs.delete(fn);},
 emit(){this.subs.forEach(f=>{try{f(this);}catch(e){}});},
 model(k){return LOCAL_MODELS[k||this.key]||LOCAL_MODELS.smol360;},
 async hasWebGPU(){try{if(!navigator.gpu)return false;const a=await navigator.gpu.requestAdapter();return !!a;}catch(e){return false;}},
 async isCached(k){try{if(!('caches' in window))return false;const c=await caches.open('transformers-cache');const keys=await c.keys();const id=this.model(k).id;return keys.some(r=>r.url.includes(id)&&/\.onnx/.test(r.url));}catch(e){return false;}},
 async load(k){
  k=LOCAL_MODELS[k]?k:'smol360';
  if(this.gen&&this.key===k)return this;
  if(this.loading&&this.key===k)return this.loading;
  if(this.gen)await this.unload();
  this.key=k;this.state='loading';this.pct=0;this.loaded=0;this.total=0;this.err='';this.emit();
  this.loading=(async()=>{
   try{
    if(!this.lib){this.lib=await import(TFJS_URL);this.lib.env.allowLocalModels=false;this.lib.env.useBrowserCache=true;}
    const files={};
    const progress_callback=p=>{if(p.status==='progress'&&p.file){files[p.file]={l:p.loaded||0,t:p.total||0};let l=0,t=0,big=false;for(const [n,f] of Object.entries(files)){l+=f.l;t+=f.t;if(/\.onnx/.test(n))big=true;}this.loaded=l;this.total=t;this.pct=big&&t?Math.max(this.pct,Math.min(99,Math.round(l/t*100))):Math.min(2,this.pct+1);this.emit();}else if(p.status==='ready'){this.pct=100;this.emit();}};
    const tryDev=async dev=>this.lib.pipeline('text-generation',this.model(k).id,{dtype:'q4',device:dev,progress_callback});
    let gen=null;
    if(await this.hasWebGPU()){try{gen=await tryDev('webgpu');this.device='WebGPU';}catch(e){console.warn('WebGPU failed, using WASM',e);gen=null;}}
    if(!gen){gen=await tryDev('wasm');this.device='WASM (CPU)';}
    this.gen=gen;this.state='ready';this.pct=100;this.emit();return this;
   }catch(e){this.gen=null;this.state='error';this.err=(e&&e.message)||String(e);this.emit();throw new Error('On-device AI failed to load: '+this.err);}
   finally{this.loading=null;}
  })();
  return this.loading;
 },
 async unload(){try{if(this.stopper)this.stopper.interrupt();if(this.gen&&this.gen.dispose)await this.gen.dispose();}catch(e){}this.gen=null;this.state='idle';this.pct=0;this.device='';this.emit();},
 async clearCache(){await this.unload();try{await caches.delete('transformers-cache');}catch(e){}this.emit();},
 /* messages: [{role,content}], returns full text. onToken(text) streams pieces. */
 async chat(messages,{onToken,signal,maxTokens=512,temperature=0.7}={}){
  await this.load(this.key);
  const {TextStreamer,InterruptableStoppingCriteria}=this.lib;
  const stopper=new InterruptableStoppingCriteria();this.stopper=stopper;
  const onAbort=()=>stopper.interrupt();if(signal){if(signal.aborted)stopper.interrupt();signal.addEventListener('abort',onAbort);}
  let text='';
  const streamer=new TextStreamer(this.gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>{text+=t;onToken&&onToken(t);}});
  const opts={max_new_tokens:maxTokens,streamer,stopping_criteria:stopper,repetition_penalty:1.1};
  if(temperature>0.05){opts.do_sample=true;opts.temperature=Math.min(1.2,temperature);opts.top_p=0.9;}else opts.do_sample=false;
  try{const out=await this.gen(messages,opts);const last=out&&out[0]&&out[0].generated_text;const full=Array.isArray(last)?(last[last.length-1]||{}).content:'';let r=(full||text).trim();if(/^"[^"]+"$/.test(r))r=r.slice(1,-1).trim();return r;}
  finally{if(signal)signal.removeEventListener('abort',onAbort);this.stopper=null;}
 }
};

/* Free image engine: fetch the real picture (with retries when the shared service is busy) and keep it as a data URL so it survives reloads and offline use. */
async function fetchFreeImage(prompt,signal,onNote){
 for(let a=1;a<=4;a++){
  try{const r=await fetch(freeImageURL(prompt),{signal});const ct=r.headers.get('content-type')||'';
   if(r.ok&&ct.startsWith('image/')){const blob=await r.blob();if(blob.size>2000)return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob);});}
   if(a<4){const ra=+(r.headers.get('retry-after')||0);onNote(`The free image engine is busy, retrying (${a}/3)…`);await wait(Math.min(15,ra||a*4)*1000,signal);}
  }catch(e){if(signal.aborted)throw e;if(a<4){onNote(`Couldn't reach the free image engine, retrying (${a}/3)…`);await wait(a*3000,signal);}}
  if(signal.aborted)throw new Error('stopped');
 }
 throw new Error('The free image engine is busy right now. Tap Retry in a moment.');
}
function freeImageURL(prompt){const seed=Math.floor(Math.random()*1e9);return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt.slice(0,900))}?width=1024&height=1024&nologo=true&seed=${seed}`;}

 cur.messages.push({role:'user',content:prompt,display:'Imagine: '+prompt,kind:'imgreq',ts:Date.now()});
 const ai={role:'assistant',content:'',prompt,ts:Date.now()};const chat=cur;
 const xk=xaiKey();
 if(xk){

  const ctrl=new AbortController();busy={ctrl,idx:chat.messages.length-1};renderSend();

  delete ai.pending;delete ai.note;busy=null;renderSend();
 }else{
  ai.pending=true;ai.note='Imagining with the free image engine…';chat.messages.push(ai);renderChat();

/* Speak a reply: xAI voice "eve" when an xAI key is active, otherwise (or on any error) the browser's built-in speech. */
async function speak(text,done){

 if(!clean.trim()){done&&done();return;}

 if(xk&&S.xaiVoice!==false){
  try{const r=await fetch('https://api.x.ai/v1/tts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+xk},body:JSON.stringify({text:clean,voice_id:'eve',language:'en'})});
   if(!r.ok)throw new Error('tts '+r.status);
   const a=new Audio(URL.createObjectURL(await r.blob()));ttsAudio=a;ttsVia='xai';
   a.onended=()=>{if(ttsAudio===a)ttsAudio=null;URL.revokeObjectURL(a.src);done&&done();};

 const st=$('#lStat');if(!st)return;const k=$('#sLocalModel')?$('#sLocalModel').value:S.localModel;const m=Local.model(k);const same=Local.key===k;
 let t;if(same&&Local.state==='loading')t=Local.pct>=99?`<b>Starting</b> ${esc(m.name)}…`:`<b>Downloading</b> ${esc(m.name)}: ${Local.pct}% (${(Local.loaded/1e6).toFixed(0)} / ${Local.total?(Local.total/1e6).toFixed(0):'?'} MB)`;
 else if(same&&Local.state==='ready')t=`<b class="ok">Ready</b> · ${esc(m.name)} on ${esc(Local.device)} · works offline`;
 else if(same&&Local.state==='error')t=`<span class="bad">Failed: ${esc(Local.err.slice(0,160))}</span>`;
 else t=`${esc(m.name)} · ${esc(m.d)} One-time download ${esc(m.size)}.<span id="lCached"></span>`;
 st.innerHTML=t;$('#lBar').style.width=(same&&(Local.state==='loading'||Local.state==='ready')?Local.pct:0)+'%';
 if(!(same&&Local.state!=='idle'))Local.isCached(k).then(c=>{const e=$('#lCached');if(e&&c)e.innerHTML=' <b class="ok">Already downloaded.</b>';});
 const lb=$('#lLoad');if(lb){lb.disabled=Local.state==='loading';lb.textContent=same&&Local.state==='ready'?'Loaded ✓':Local.state==='loading'?'Loading…':'Download & load';}
}
Local.on(()=>{renderLocalStat();renderEngine();});
async function setLogo(){
 logoURL=DEFAULT_LOGO;
 applyLogo();
}
/* ---------- Menus ---------- */
function openMenu(anchor,items){
 const m=$('#menu');m.innerHTML=items.map((it,i)=>`<button data-mi="${i}" class="${it.on?'on':''}">${it.label}${it.sub?`<small>${it.sub}</small>`:''}</button>`).join('');
 m.classList.add('open');m._items=items;const r=anchor.getBoundingClientRect();
 const w=m.offsetWidth,h=m.offsetHeight;const x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);let y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);
 m.style.left=x+'px';m.style.top=y+'px';
}
function closeMenu(){$('#menu').classList.remove('open');}
function closeNav(){document.body.classList.remove('nav-open');}
function autosize(){const t=$('#inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px';renderSend();}
async function readSettingsForm(){
 if(!$('#sTimeout'))return;
 S.baseUrl=$('#sUrl').value.trim();S.apiKey=$('#sKey').value.trim();S.model=$('#sModel').value.trim();S.vision=$('#sVision').checked;S.xaiVoice=$('#sXaiVoice').checked;S.localModel=$('#sLocalModel').value||'smol360';
 S.timeout=Math.max(10,Math.min(300,+$('#sTimeout').value||60));S.temperature=+$('#sTemp').value;S.sysExtra=$('#sSys').value.trim();
 if(S.provider==='custom'&&!S.baseUrl){S.provider='free';toast('No URL set, using Free');}
}
/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
 if($('#menu').classList.contains('open')&&!e.target.closest('#menu')){closeMenu();if(e.target.closest('#engBtn,#fab,#plusBtn'))return;}
 const t=e.target.closest('button,[data-close]');
 if(e.target.id==='sheet')return closeSheet();
 if(!t)return;
 if(t.matches('[data-close]'))return closeSheet();
 const d=t.dataset;
 if(d.open)return SHEETS[d.open]();
 if(d.chat)return openChat(d.chat);
 if(d.mi!==undefined){const it=$('#menu')._items[d.mi];closeMenu();return it.fn();}
 if(d.card){
  if(d.card==='create')return openMenu(t,[{label:'🖼 Generate an image',fn:()=>genImage()},{label:'✍️ Write content',fn:()=>{cur.persona='writer';renderHome();$('#inp').value='Write ';$('#inp').focus();autosize();}}]);
  const p={code:['coder','Help me write code. I want to build '],analyze:['analyst','Analyze this for me: '],plan:['planner','Help me plan ']}[d.card];
  cur.persona=p[0];renderHome();$('#inp').value=p[1];$('#inp').focus();autosize();return;
 }
 if(d.persona){closeSheet();newChat(d.persona);toast('Persona: '+persona().name);return;}
 if(d.ex){closeSheet();newChat();send(d.ex);return;}
 if(d.rm!==undefined){attachments.splice(+d.rm,1);return renderAttach();}
 if(d.ren){const c=chats.find(c=>c.id===d.ren);const n=prompt('Rename chat',c.title);if(n){c.title=n.slice(0,80);await DB.put('chats',c);if(cur&&cur.id===c.id)cur.title=c.title;renderRecent();SHEETS.chats();}return;}
 if(d.exp){const c=chats.find(c=>c.id===d.exp);return download((c.title.replace(/[^\w-]+/g,'_')||'chat')+'.md',chatMarkdown(c),'text/markdown');}
 if(d.delc){if(confirm('Delete this chat?')){await deleteChat(d.delc);SHEETS.chats();}return;}
 if(d.delk){if(!confirm('Delete this note?'))return;await DB.del('knowledge',d.delk);knowledge=knowledge.filter(k=>k.id!==d.delk);$('#knList').innerHTML=knRows();return;}
 if(d.tool==='image'){closeSheet();return genImage();}
 if(d.tool==='voice'){closeSheet();voiceMode=true;renderSend();return listen(true);}
 if(d.prov){S.provider=d.prov;$$('[data-prov]').forEach(b=>b.classList.toggle('sel',b.dataset.prov===d.prov));$('#customBox').style.display=d.prov==='custom'?'':'none';$('#localBox').style.display=d.prov==='local'?'':'none';if(d.prov==='local')renderLocalStat();return;}
 if(d.mode){S.mode=d.mode;await saveSettings();renderModes();if(d.mode==='imagine')toast('Imagine: describe a picture and send');return;}
 if(d.act){
  const msgEl=t.closest('.msg');const i=msgEl?+msgEl.dataset.i:-1;const m=cur&&cur.messages[i];
  const codeEl=t.closest('.code');const code=codeEl?CODE[+codeEl.dataset.k]||codeEl.querySelector('code').textContent:'';
  if(d.act==='copy'){await navigator.clipboard?.writeText(code).catch(()=>{});return toast('Copied');}
  if(d.act==='preview'){window._prevCode=code;return openSheet(head('Preview')+`<iframe class="prev" sandbox="allow-scripts allow-pointer-lock" srcdoc="${esc(code)}"></iframe><div class="row" style="margin-top:10px"><button class="btn pri" id="prevDl">Save .html</button><button class="btn" id="prevTab">Open full screen</button></div>`);}
  if(d.act==='dl')return download('blacknode-app.html',code,'text/html');
  if(d.act==='mcopy'){await navigator.clipboard?.writeText(m.content||m.image||'').catch(()=>{});return toast('Copied');}
  if(d.act==='speak'){if(isSpeaking()){stopSpeak();return;}return speak(m.content||m.prompt||'');}
  if(d.act==='imgdl'){if(String(m.image).startsWith('data:')){const a=document.createElement('a');a.href=m.image;a.download='vanta-image.jpg';document.body.appendChild(a);a.click();a.remove();return;}return window.open(m.image,'_blank','noopener');}
  if(d.act==='retry')return retry(i);
 }
 switch(t.id){
  case 'burger':document.body.classList.add('nav-open');break;
  case 'newChat':case 'editBtn':case 'refreshBtn':newChat();break;
  case 'personaBtn':case 'personaBtnM':SHEETS.personas();break;
  case 'bellBtn':$('#bellDot').hidden=true;SHEETS.status();break;
  case 'engBtn':openMenu(t,[{label:'Free Live AI',sub:'no key',on:S.provider==='free',fn:async()=>{S.provider='free';await saveSettings();renderModes();toast('Engine: Free Live AI');}},{label:'On-Device Offline AI',sub:Local.model(S.localModel).size,on:S.provider==='local',fn:async()=>{S.provider='local';await saveSettings();renderModes();SHEETS.settings();}},{label:'Custom / your key',sub:S.baseUrl?engineLabel():'set up',on:S.provider==='custom',fn:async()=>{if(!S.baseUrl){S.provider='custom';return SHEETS.settings();}S.provider='custom';await saveSettings();renderModes();toast('Engine: '+engineLabel());}},{label:'Engine settings…',fn:SHEETS.settings}]);break;
  case 'fab':openMenu(t,[{label:'🖼 Generate image',fn:()=>genImage()},{label:'🧭 Explore',fn:SHEETS.explore},{label:'📚 Knowledge',fn:SHEETS.knowledge},{label:'🛠 Tools',fn:SHEETS.tools},{label:'💬 All chats',fn:SHEETS.chats},{label:'📡 Status',fn:SHEETS.status},{label:'⚙️ Settings',fn:SHEETS.settings}]);break;
  case 'plusBtn':openMenu(t,[{label:'📎 Attach file',sub:'text, code, image',fn:()=>$('#fileIn').click()},{label:'🖼 Generate image',fn:()=>genImage()},{label:'🔎 Web search',sub:S.search?'on':'off',on:S.search,fn:async()=>{S.search=!S.search;await saveSettings();renderModes();toast('Web search '+(S.search?'on':'off'));}},{label:'💡 Show reasoning',sub:S.reason?'on':'off',on:S.reason,fn:async()=>{S.reason=!S.reason;await saveSettings();renderModes();toast('Reasoning '+(S.reason?'shown':'hidden'));}},{label:'⤓ Export this chat',fn:()=>cur&&cur.messages.length?download((cur.title.replace(/[^\w-]+/g,'_')||'chat')+'.md',chatMarkdown(cur),'text/markdown'):toast('Nothing to export yet')}]);break;
  case 'heroImg':genImage();break;
  case 'lLoad':{const k=$('#sLocalModel').value;S.localModel=k;S.provider='local';$$('[data-prov]').forEach(b=>b.classList.toggle('sel',b.dataset.prov==='local'));await saveSettings();renderModes();Local.load(k).then(()=>toast('On-device AI ready ('+Local.device+')'),e=>toast(e.message.slice(0,120)));break;}
  case 'lUnload':await Local.unload();toast('On-device model unloaded (download kept)');break;
  case 'lClear':if(confirm('Delete the downloaded on-device model from this browser? You can download it again any time.')){await Local.clearCache();renderLocalStat();toast('Download deleted');}break;
  case 'micBtn':listen(false);break;
  case 'sendBtn':
   if(busy)stop();
   else if(voiceMode&&!$('#inp').value.trim()){voiceMode=false;if(rec)rec.stop();stopSpeak();renderSend();toast('Voice mode off');}
   else if(!$('#inp').value.trim()&&!attachments.length&&isPhone()){voiceMode=true;renderSend();toast('Voice mode: speak now');listen(true);}
   else send();break;
  case 'searchChip':S.search=!S.search;await saveSettings();renderModes();break;
  case 'prevDl':download('blacknode-app.html',window._prevCode||'','text/html');break;
  case 'prevTab':{const w=window.open('','_blank');if(w){w.document.write(window._prevCode||'');w.document.close();}break;}
  case 'knAdd':{const ti=$('#knT').value.trim(),x=$('#knX').value.trim();if(!x)return toast('Add some text first');const k={id:uid(),title:ti||x.slice(0,40),text:x,on:true};await DB.put('knowledge',k);knowledge.push(k);$('#knList').innerHTML=knRows();$('#knT').value='';$('#knX').value='';toast('Saved to Knowledge');break;}
  case 'knFile':{const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return;const k={id:uid(),title:f.name,text:(await f.text()).slice(0,100000),on:true};await DB.put('knowledge',k);knowledge.push(k);$('#knList').innerHTML=knRows();toast('Saved to Knowledge');};i.click();break;}
  case 'sModels':{const u=$('#sUrl').value.trim().replace(/\/+$/,'');if(!u)return toast('Set a base URL first');try{const h={};const k=$('#sKey').value.trim();if(k)h.Authorization='Bearer '+k;const r=await fetch(u+'/models',{headers:h});const j=await r.json();const ids=(j.data||j.models||[]).map(m=>m.id||m.name).filter(Boolean);if(!ids.length)throw 0;openMenu(t,ids.slice(0,40).map(id=>({label:esc(id),fn:()=>{$('#sModel').value=id;}})));}catch(e){toast('Couldn\'t list models');}break;}
  case 'sTest':{const keep={...S};await readSettingsForm();$('#sTestOut').textContent='Testing…';$('#sTestOut').innerHTML=await testConn();break;}
  case 'sSave':await readSettingsForm();await saveSettings();renderModes();toast('Settings saved · '+engineLabel());closeSheet();break;
  case 'sExport':download(`blacknode-vanta-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'blacknode-vanta',v:1,exported:Date.now(),settings:{...S,apiKey:''},chats,knowledge},null,1),'application/json');toast('Backup saved');break;
  case 'sImport':$('#importIn').click();break;
  case 'sWipe':if(confirm('Delete ALL chats, knowledge, and settings from this device? This can\'t be undone.')){await DB.clear('chats');await DB.clear('knowledge');await DB.clear('kv');chats=[];knowledge=[];S={...DEFAULTS};logoURL=DEFAULT_LOGO;applyLogo();closeSheet();newChat();renderModes();renderMe();toast('All data deleted');}break;
  case 'pSave':S.name=$('#pName').value.trim()||'User';S.plan=$('#pPlan').value.trim();await saveSettings();renderMe();closeSheet();break;
 }
});
$('#scrim').addEventListener('click',closeNav);
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.kn){const k=knowledge.find(k=>k.id===t.dataset.kn);k.on=t.checked;await DB.put('knowledge',k);return;}
 if(t.id==='sPreset'&&t.value){const p=PRESETS[t.value];$('#sUrl').value=p.url;$('#sModel').value=p.model;$('#presetNote').textContent=p.note||'';}
 if(t.id==='sLocalModel')renderLocalStat();
 if(t.id==='tSearch'){S.search=t.checked;await saveSettings();renderModes();}
 if(t.id==='tReason'){S.reason=t.checked;await saveSettings();renderModes();}
 if(t.id==='tVoice'){S.voiceReply=t.checked;await saveSettings();toast('Read replies aloud '+(t.checked?'on':'off'));}
 if(t.id==='fileIn'){await addFiles([...t.files]);t.value='';}
 if(t.id==='importIn'&&t.files[0]){await importBackup(t.files[0]);t.value='';}
});
document.addEventListener('input',e=>{if(e.target.id==='sTemp')$('#tv').textContent=e.target.value;});
$('#inp').addEventListener('input',autosize);
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!isPhone()){e.preventDefault();send();}});
$('#inp').addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeMenu();closeNav();}});
addEventListener('resize',renderSend);
setInterval(renderRecent,60000);
/* ---------- Boot ---------- */
(async()=>{
 try{await DB.open();}catch(e){/* falls back to localStorage or memory */}
 try{const s=await DB.get('kv','settings');if(s)S={...DEFAULTS,...s};if(!MODES[S.mode])S.mode=S.mode==='thinking'||S.mode==='deep'?'think':'fast';if(!['free','local','custom'].includes(S.provider))S.provider='free';
  chats=await DB.all('chats');knowledge=await DB.all('knowledge');
 }catch(e){chats=[];knowledge=[];}
 if(DB.mode==='mem')setTimeout(()=>toast('Storage is blocked here: chats last until you close this page. Use Settings > Export backup.'),900);
 applyLogo();renderModes();renderMe();newChat();renderSend();
})();
</script>
