<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>404 · BlackNode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090d'/%3E%3Cpath d='M7 7h6M7 7v6M25 25h-6M25 25v-6' stroke='%23e041ff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%23e041ff' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
:root{--bg:#07090d;--line:#232b3d;--txt:#e8ecf4;--dim:#8b94a9;--mg:#e041ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
.box{max-width:460px;width:100%;text-align:center;border:1px solid var(--line);background:rgba(7,9,13,.88);padding:32px 22px;position:relative}
.box::before,.box::after{content:"";position:absolute;width:12px;height:12px;border:solid var(--mg)}
.box::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.box::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.code{font:700 64px/1 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--mg);text-shadow:0 0 28px rgba(224,65,255,.55);letter-spacing:.04em}
.wm{font:600 11px/1 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--dim);margin-top:14px}
.wm b{color:var(--mg)}
h1{font-size:22px;margin:16px 0 6px}
p{color:var(--dim);margin:0 0 22px;line-height:1.5}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:600}
a.btn:hover{border-color:var(--mg)}
a.pri{background:var(--mg);border-color:var(--mg);color:#0a0510;box-shadow:0 0 18px -4px var(--mg)}
</style>
</head>
<body>
<main class="box">
 <div class="code">404</div>
 <div class="wm">BLACKNODE <b>//</b> SIGNAL LOST</div>

 <p>The link may be old or mistyped. Pick up where you left off:</p>
 <div class="acts"><a class="btn pri" href="/">BlackNode home</a><a class="btn" href="/core/">Core</a><a class="btn" href="/vanta/">Vanta</a></div>
</main>
</body>
</html>
